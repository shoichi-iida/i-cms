[tools]
python = "3.14.2"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "セットアップ"
run = ["python -m pip install -r requirements.txt"]

[tasks.dev]
description = "開発環境起動"
run = ["python server.py"]

[tasks.test]
description = "単体テスト実行"
run = ["python -m unittest discover tests -v"]
